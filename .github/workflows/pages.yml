name: Deploy Lucidity to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['drone-studio/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: drone-studio
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: drone-studio/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Install the local workbench test shell
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: npm test -- --maxWorkers=2
      - run: npm run build:demo
      - uses: actions/upload-pages-artifact@v4
        with:
          path: drone-studio/dist-demo
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
